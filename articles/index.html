<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles | Samrah's Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --text:#111827;
  --muted:#6b7280;
  --card:#ffffff;
  --border:#e5e7eb;
}

/* 🌈 Soft editorial gradient background */
body{
  margin:0;
  font-family:Inter, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 20%, #eef2ff 0%, transparent 40%),
    radial-gradient(circle at 80% 60%, #fdf2f8 0%, transparent 40%),
    #f7f7f9;
}

/* layout */
.container{
  max-width:1100px;
  margin:90px auto;
  padding:0 24px;
}

/* title */
h1{
  font-family:"Playfair Display", serif;
  font-size:44px;
  text-align:center;
  margin-bottom:60px;
  letter-spacing:-0.5px;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(320px, 420px));
  justify-content:center;
  gap:32px;
}
}

/* ✨ premium cards */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:48px 40px;
  text-align:center;
  text-decoration:none;
  color:inherit;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  box-shadow:0 10px 30px rgba(0,0,0,.04);
  position:relative;
  overflow:hidden;
}

/* subtle glow */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, transparent, rgba(99,102,241,.08), transparent);
  opacity:0;
  transition:.4s;
}

.card:hover::before{
  opacity:1;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 30px 60px rgba(0,0,0,.12);
  border-color:#dfe3ea;
}

/* card title */
.card h2{
  font-family:"Playfair Display", serif;
  font-size:28px;
  margin:0 0 12px;
}

/* description */
.card p{
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
}

/* mobile */
@media (max-width:640px){
  h1{font-size:34px;}
  .card{padding:36px 28px;}
}
</style>

</head>

<body>

<div class="container">
  <h1>Articles</h1>

  <div class="grid">

<a class="card" href="brand-strategies/index.html">
  <h2>Brand Strategies</h2>
  <p>Deep dives into how great brands build memory, meaning, and market power.</p>
</a>

<a class="card" href="campaigns/index.html">
  <h2>Campaigns</h2>
  <p>Breakdowns of buzz-worthy marketing moments that captured attention and culture.</p>
</a>

  </div>
</div>

</body>
</html>
