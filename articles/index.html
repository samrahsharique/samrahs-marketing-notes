<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles | Samrah's Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --text:#111827;
  --muted:#6b7280;
  --card:#ffffff;
  --border:#e5e7eb;
}

body{
  margin:0;
  font-family:Inter, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 20%, #eef2ff 0%, transparent 40%),
    radial-gradient(circle at 80% 60%, #fdf2f8 0%, transparent 40%),
    #f7f7f9;
}

/* layout */
.container{
  max-width:900px;
  margin:90px auto;
  padding:0 24px;
  text-align:center;
}

h1{
  font-family:"Playfair Display", serif;
  font-size:44px;
  margin-bottom:60px;
}

/* centered stable grid */
.grid{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

/* premium card */
.card{
  width:360px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:48px 36px;
  text-align:center;
  text-decoration:none;
  color:inherit;
  transition:transform .25s ease, box-shadow .25s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.05);
}

/* stable hover (no jitter) */
.card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 50px rgba(0,0,0,.12);
}

.card h2{
  font-family:"Playfair Display", serif;
  font-size:28px;
  margin:0 0 12px;
}

.card p{
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
}

@media (max-width:640px){
  h1{font-size:34px;}
  .card{width:100%;}
}
</style>

</head>

<body>

<div class="container">
  <h1>Articles</h1>

  <div class="grid">

```
<a class="card" href="brand-strategies/index.html">
  <h2>Brand Strategies</h2>
  <p>Deep dives into how great brands build memory, meaning, and market power.</p>
</a>

<a class="card" href="campaigns/index.html">
  <h2>Campaigns</h2>
  <p>Breakdowns of buzz-worthy marketing moments that captured attention and culture.</p>
</a>
```

  </div>
</div>

</body>
</html>
