<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Strategies | Samrah's Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f7f7f9;
    color: #111827;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
}


/* =========================================
   PAGE HEADER
   ========================================= */

.page-header {
    text-align: center;
    padding: 65px 24px 40px;
}

.page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 5vw, 68px);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
}


/* =========================================
   ARTICLE GRID
   ========================================= */

.article-grid {
    width: 100%;
    max-width: 960px;

    margin: 45px auto 100px;

    padding: 0 20px;

    display: grid;

    grid-template-columns: repeat(2, 440px);

    gap: 34px;

    justify-content: center;

    align-items: start;
}


/* =========================================
   SINGLE ARTICLE
   Same exact card size
   ========================================= */

.article-grid:has(.article-card:only-child) {
    grid-template-columns: 440px;
}


/* =========================================
   ARTICLE CARD
   ========================================= */

.article-card {
    display: flex;
    flex-direction: column;

    width: 440px;
    height: 470px;

    background: #ffffff;

    border-radius: 25px;

    overflow: hidden;

    text-decoration: none;

    color: inherit;

    box-shadow:
        0 12px 35px rgba(17, 24, 39, 0.07);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}


.article-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 20px 45px rgba(17, 24, 39, 0.11);
}


/* =========================================
   CARD IMAGE
   ========================================= */

.article-card-image {
    width: 100%;

    height: 275px;

    object-fit: cover;

    display: block;

    flex-shrink: 0;
}


/* =========================================
   CARD CONTENT
   ========================================= */

.article-card-content {
    padding: 27px 30px 30px;

    display: flex;

    flex-direction: column;

    flex: 1;
}


.article-card-title {
    font-family: 'Playfair Display', serif;

    font-size: 29px;

    font-weight: 700;

    line-height: 1.15;

    margin-bottom: 10px;
}


.article-card-description {
    font-size: 15px;

    line-height: 1.6;

    color: #637083;

    max-width: 380px;
}


/* =========================================
   TABLET
   ========================================= */

@media (max-width: 1000px) {

    .article-grid {
        grid-template-columns:
            repeat(2, minmax(0, 440px));

        max-width: 940px;
    }

    .article-card {
        width: 100%;
    }

}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {

    .page-header {
        padding: 48px 20px 28px;
    }

    .page-header h1 {
        font-size: 46px;
    }


    .article-grid {

        width: 100%;

        padding: 0 22px;

        margin-top: 25px;

        grid-template-columns: 1fr;

        gap: 28px;
    }


    .article-grid:has(.article-card:only-child) {
        grid-template-columns: 1fr;
    }


    .article-card {

        width: 100%;

        height: auto;

        min-height: 0;
    }


    .article-card-image {

        height: auto;

        aspect-ratio: 16 / 10;
    }


    .article-card-content {

        padding: 24px 25px 27px;
    }


    .article-card-title {

        font-size: 27px;
    }


    .article-card-description {

        font-size: 15px;
    }

}


/* =========================================
   VERY SMALL PHONES
   ========================================= */

@media (max-width: 400px) {

    .page-header h1 {
        font-size: 40px;
    }

    .article-grid {
        padding: 0 18px;
    }

}

</style>
</head>


<body>


<header class="page-header">

    <h1>Brand Strategies</h1>

</header>


<main class="article-grid">


    <!-- RED BULL -->

    <a
        class="article-card"
        href="red-bull/"
    >

        <img
            class="article-card-image"
            src="red-bull/assets/red-bull2.jpg"
            alt="Red Bull"
        >


        <div class="article-card-content">

            <h2 class="article-card-title">
                Red Bull
            </h2>

            <p class="article-card-description">
                A strategic breakdown of category creation and cultural ownership.
            </p>

        </div>

    </a>


</main>


</body>
</html>
