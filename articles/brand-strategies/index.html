<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Strategies | Samrah's Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {
    background: #f7f7f9;
    color: #111827;
    font-family: 'Inter', sans-serif;
}


/* =========================================
   HEADER
   ========================================= */

.page-header {
    text-align: center;

    padding-top: 58px;
    padding-bottom: 42px;

    padding-left: 20px;
    padding-right: 20px;
}


.page-header h1 {

    font-family: 'Playfair Display', serif;

    font-size: clamp(48px, 5vw, 68px);

    font-weight: 700;

    letter-spacing: -0.04em;

    line-height: 1;
}


/* =========================================
   ARTICLE AREA
   ========================================= */

.article-grid {

    width: 900px;

    max-width: calc(100% - 40px);

    margin: 20px auto 100px;

    display: grid;

    grid-template-columns: repeat(2, 380px);

    gap: 34px;

    justify-content: center;

    align-items: start;
}


/* =========================================
   ARTICLE CARD
   ========================================= */

.article-card {

    width: 380px;

    background: #ffffff;

    border-radius: 24px;

    overflow: hidden;

    text-decoration: none;

    color: inherit;

    box-shadow:
        0 10px 30px rgba(17, 24, 39, 0.055);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}


.article-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 18px 40px rgba(17, 24, 39, 0.10);
}


/* =========================================
   IMAGE
   ========================================= */

.article-card-image {

    display: block;

    width: 100%;

    height: 225px;

    object-fit: cover;
}


/* =========================================
   CARD TEXT
   ========================================= */

.article-card-content {

    padding: 24px 26px 27px;
}


.article-card-title {

    font-family: 'Playfair Display', serif;

    font-size: 27px;

    font-weight: 700;

    line-height: 1.15;

    margin-bottom: 10px;
}


.article-card-description {

    font-family: 'Inter', sans-serif;

    font-size: 15px;

    font-weight: 400;

    line-height: 1.55;

    color: #637083;
}


/* =========================================
   TABLET
   ========================================= */

@media (max-width: 850px) {

    .article-grid {

        width: 100%;

        grid-template-columns:
            repeat(2, minmax(0, 380px));

        gap: 25px;
    }


    .article-card {

        width: 100%;
    }

}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 650px) {

    .page-header {

        padding-top: 45px;

        padding-bottom: 30px;
    }


    .page-header h1 {

        font-size: 45px;
    }


    .article-grid {

        width: 100%;

        max-width: 100%;

        padding: 0 22px;

        margin-top: 10px;

        grid-template-columns: 1fr;

        gap: 25px;
    }


    .article-card {

        width: 100%;
    }


    .article-card-image {

        height: auto;

        aspect-ratio: 16 / 10;
    }

}


/* =========================================
   SMALL PHONES
   ========================================= */

@media (max-width: 400px) {

    .page-header h1 {

        font-size: 39px;
    }


    .article-grid {

        padding: 0 18px;
    }


    .article-card-content {

        padding: 22px 23px 24px;
    }

}

</style>

</head>


<body>


<header class="page-header">

    <h1>Brand Strategies</h1>

</header>


<main class="article-grid">


    <!-- RED BULL -->

    <a
        class="article-card"
        href="red-bull/"
    >

        <img
            class="article-card-image"
            src="red-bull/assets/red-bull2.jpg"
            alt="Red Bull"
        >


        <div class="article-card-content">

            <h2 class="article-card-title">
                Red Bull
            </h2>


            <p class="article-card-description">
                A strategic breakdown of category creation and cultural ownership.
            </p>

        </div>

    </a>


</main>


</body>

</html>
