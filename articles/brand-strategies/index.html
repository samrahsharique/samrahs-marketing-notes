<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Strategies | Samrah's Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f7f7f9;
    color: #111827;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
}

/* ---------- HEADER ---------- */

.page-header {
    text-align: center;
    padding: 70px 24px 45px;
}

.page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 6vw, 72px);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
}


/* ---------- ARTICLE GRID ---------- */

.article-grid {
    width: min(1080px, 88%);
    margin: 40px auto 100px;

    display: grid;

    /* Two fixed-size cards on desktop */
    grid-template-columns: repeat(2, 520px);

    gap: 36px;

    justify-content: center;
    align-items: stretch;
}


/* When there is only one article,
   keep the exact same card size and center it */

.article-grid:has(.article-card:only-child) {
    grid-template-columns: 520px;
}


/* ---------- CARD ---------- */

.article-card {
    display: flex;
    flex-direction: column;

    width: 520px;
    height: 520px;

    background: #ffffff;

    border-radius: 28px;
    overflow: hidden;

    text-decoration: none;
    color: inherit;

    box-shadow: 0 14px 40px rgba(17, 24, 39, 0.07);

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
}


.article-card:hover {
    transform: translateY(-6px);

    box-shadow:
        0 22px 55px rgba(17, 24, 39, 0.12);
}


/* ---------- IMAGE ---------- */

.article-card-image {
    width: 100%;

    height: 325px;

    object-fit: cover;

    display: block;
}


/* ---------- CARD CONTENT ---------- */

.article-card-content {
    display: flex;
    flex-direction: column;

    flex: 1;

    padding: 30px 30px 32px;
}


.article-card-title {
    font-family: 'Playfair Display', serif;

    font-size: 30px;

    font-weight: 700;

    line-height: 1.15;

    margin-bottom: 12px;
}


.article-card-description {
    font-size: 16px;

    line-height: 1.65;

    color: #637083;

    max-width: 520px;
}


/* ---------- MOBILE ---------- */

@media (max-width: 1100px) {

    .article-grid {
        width: 90%;

        grid-template-columns:
            repeat(2, minmax(0, 520px));
    }

    .article-card {
        width: 100%;
    }
}


/* ---------- SMALL TABLETS / PHONES ---------- */

@media (max-width: 700px) {

    .page-header {
        padding: 48px 20px 28px;
    }

    .page-header h1 {
        font-size: 46px;
    }


    .article-grid {

        width: 88%;

        grid-template-columns: 1fr;

        gap: 28px;

        margin-top: 25px;
    }


    .article-grid:has(.article-card:only-child) {
        grid-template-columns: 1fr;
    }


    .article-card {

        width: 100%;

        height: auto;

        min-height: 0;
    }


    .article-card-image {

        height: auto;

        aspect-ratio: 16 / 10;
    }


    .article-card-content {

        padding: 25px;
    }


    .article-card-title {

        font-size: 27px;
    }


    .article-card-description {

        font-size: 15px;
    }

}


/* ---------- VERY SMALL PHONES ---------- */

@media (max-width: 400px) {

    .page-header h1 {
        font-size: 40px;
    }

    .article-grid {
        width: 90%;
    }

    .article-card-content {
        padding: 22px;
    }

    .article-card-title {
        font-size: 25px;
    }

}

</style>
</head>


<body>


<!-- ==============================
     PAGE HEADER
     ============================== -->

<header class="page-header">

    <h1>Brand Strategies</h1>

</header>



<!-- ==============================
     ARTICLE GRID
     ============================== -->

<main class="article-grid">


    <!-- ==========================
         RED BULL
         ========================== -->

    <a
        class="article-card"
        href="red-bull/"
    >

        <img
            class="article-card-image"
            src="red-bull/assets/red-bull2.jpg"
            alt="Red Bull"
        >


        <div class="article-card-content">

            <h2 class="article-card-title">
                Red Bull
            </h2>


            <p class="article-card-description">
                A strategic breakdown of category creation and cultural ownership.
            </p>

        </div>

    </a>


</main>


</body>
</html>
