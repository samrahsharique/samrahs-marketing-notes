<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Strategies | Samrah's Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">


<style>

/* ================================
   BASIC
================================ */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7f9;
    color: #111827;
    font-family: Inter, sans-serif;
}


/* ================================
   TITLE
================================ */

h1 {
    margin: 0;

    padding: 60px 20px 45px;

    text-align: center;

    font-family: "Playfair Display", serif;

    font-size: 64px;

    line-height: 1;
}


/* ================================
   CARD GRID
================================ */

.grid {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 0 20px 100px;

    display: grid;

    grid-template-columns:
        repeat(2, 380px);

    justify-content: center;

    gap: 32px;
}


/* ================================
   CARD
================================ */

.card {

    width: 380px;

    background: white;

    border-radius: 24px;

    overflow: hidden;

    text-decoration: none;

    color: inherit;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.06);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}


.card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 16px 40px rgba(0,0,0,0.10);
}


/* ================================
   IMAGE
================================ */

.card img {

    width: 100%;

    height: 225px;

    display: block;

    object-fit: cover;
}


/* ================================
   TEXT
================================ */

.card-content {

    padding: 24px 26px 27px;
}


.card h2 {

    margin: 0 0 10px;

    font-family: "Playfair Display", serif;

    font-size: 28px;

    line-height: 1.1;
}


.card p {

    margin: 0;

    color: #637083;

    font-size: 15px;

    line-height: 1.55;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 850px) {

    .grid {

        grid-template-columns: 380px;

    }

}


@media (max-width: 450px) {

    h1 {

        font-size: 42px;

        padding-top: 45px;

        padding-bottom: 30px;
    }


    .grid {

        grid-template-columns: 1fr;

        padding-left: 20px;

        padding-right: 20px;
    }


    .card {

        width: 100%;
    }


    .card img {

        height: auto;

        aspect-ratio: 16 / 10;
    }

}

</style>

</head>


<body>


<h1>
    Brand Strategies
</h1>


<div class="grid">


    <!-- RED BULL -->

    <a
        class="card"
        href="red-bull/"
    >

        <img
            src="red-bull/assets/red-bull2.jpg"
            alt="Red Bull"
        >


        <div class="card-content">

            <h2>
                Red Bull
            </h2>

            <p>
                A strategic breakdown of category creation and cultural ownership.
            </p>

        </div>

    </a>

    <!-- ZARA -->

 <a
    class="card"
    href="zara.html"
 >

    <img
        src="zara/assets/zara-card.jpg"
        alt="Zara"
    >

      <div class="card-content">

        <h2>
             Zara
        </h2>

        <p>
            How speed became a system for eliminating uncertainty.
        </p>

      </div>

   </a>


    <!--
    FUTURE ARTICLES GO HERE

    Example:

    <a class="card" href="zara/">

        <img
            src="zara/assets/zara.jpg"
            alt="Zara"
        >

        <div class="card-content">

            <h2>Zara</h2>

            <p>
                Your Zara article description.
            </p>

        </div>

    </a>

    -->


</div>


</body>

</html>
