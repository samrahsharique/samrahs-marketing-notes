<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaigns | Samrah’s Marketing Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#f7f7f9;
  color:#111827;
}

.container{
  max-width:1200px;
  margin:80px auto;
  padding:0 32px;
}

h1{
  font-family:"Playfair Display", serif;
  font-size:52px;
  margin-bottom:50px;
  text-align:center;
}
}

/* campaign tile */
.tile{
  background:white;
  border-radius:22px;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
  transition:all .25s ease;
  max-width:340px;
}

.tile:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(0,0,0,.12);
}

.tile img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.content{
  padding:22px;
}

.content h2{
  font-family:"Playfair Display", serif;
  font-size:28px;
  margin:0 0 10px;
}

.content p{
  color:#6b7280;
  margin:0;
  line-height:1.5;
}

/* optional placeholders */
.placeholder{
  border:1px dashed #d1d5db;
  border-radius:22px;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
  font-size:14px;
  background:rgba(255,255,255,0.5);
}
</style>

</head>

<body>
<div class="container">
  <h1>Campaigns</h1>

  <div class="grid">

<!-- live article tile -->
<a class="tile" href="../scary-clown-night.html">
  <img src="scary-clown-night.jpg" alt="Scary Clown Night">
  <div class="content">
    <h2>#ScaryClownNight</h2>
    <p>Burger King’s media planning masterclass.</p>
  </div>
</a>
  </div>
</div>
</body>
</html>
